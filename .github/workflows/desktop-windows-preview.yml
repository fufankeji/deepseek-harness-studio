name: Desktop Windows Preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop-preview-v* release tag to extend.
        required: true
        type: string
      macos_asset:
        description: Exact macOS preview ZIP already attached to the release.
        required: true
        type: string
      expected_app_asar_sha256:
        description: SHA-256 of the accepted macOS app.asar payload.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-windows-preview-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ inputs.release_tag }}
  MACOS_PREVIEW_ASSET: ${{ inputs.macos_asset }}
  EXPECTED_APP_ASAR_SHA256: ${{ inputs.expected_app_asar_sha256 }}

jobs:
  build-smoke-and-publish:
    name: Build, smoke, and publish Windows x64 preview
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}\setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate immutable preview inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./apps/desktop/package.json').version"
          $expectedTag = "desktop-preview-v$version"
          $expectedAsset = "DeepSeek-Harness-Desktop-$version-macos-arm64-preview.zip"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag must be $expectedTag; received $env:RELEASE_TAG."
          }
          if ($env:MACOS_PREVIEW_ASSET -ne $expectedAsset) {
            throw "macOS asset must be $expectedAsset; received $env:MACOS_PREVIEW_ASSET."
          }
          if ($env:EXPECTED_APP_ASAR_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Expected app.asar SHA-256 must contain exactly 64 lowercase hexadecimal characters.'
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release $env:RELEASE_TAG does not exist." }

      - name: Install packaging dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the accepted macOS payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'accepted-preview'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:MACOS_PREVIEW_ASSET `
            --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the accepted macOS preview failed.' }

      - name: Prepare the accepted application payload
        id: payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "accepted-preview\$env:MACOS_PREVIEW_ASSET"
          $expanded = Join-Path $env:RUNNER_TEMP 'accepted-preview-expanded'
          $payloadPaths = @(
            'DeepSeek Harness.app/Contents/Resources/app.asar',
            'DeepSeek Harness.app/Contents/Resources/host/*',
            'DeepSeek Harness.app/Contents/Resources/desktop-resources/*'
          )
          7z x $archive "-o$expanded" -y $payloadPaths | Out-Host
          if ($LASTEXITCODE -notin @(0, 1)) { throw "7z exited with $LASTEXITCODE." }

          $resources = Join-Path $expanded 'DeepSeek Harness.app\Contents\Resources'
          $appAsar = Join-Path $resources 'app.asar'
          if (-not (Test-Path -LiteralPath $appAsar -PathType Leaf)) {
            throw "Accepted app.asar is missing at $appAsar."
          }
          $appHash = (Get-FileHash -LiteralPath $appAsar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($appHash -ne $env:EXPECTED_APP_ASAR_SHA256) {
            throw "Accepted app.asar hash is $appHash; expected $env:EXPECTED_APP_ASAR_SHA256."
          }

          $asarCli = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'node_modules\.pnpm') `
            -Recurse -File -Filter asar.js |
            Where-Object FullName -Like '*@electron+asar@*\node_modules\@electron\asar\bin\asar.js' |
            Select-Object -First 1
          if ($null -eq $asarCli) { throw 'The @electron/asar CLI was not installed.' }
          $appSource = Join-Path $env:RUNNER_TEMP 'accepted-app-source'
          & node $asarCli.FullName extract $appAsar $appSource
          if ($LASTEXITCODE -ne 0) { throw "asar extraction exited with $LASTEXITCODE." }

          $desktop = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop'
          Remove-Item (Join-Path $desktop 'lib') -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $appSource 'lib') (Join-Path $desktop 'lib') -Recurse
          Remove-Item (Join-Path $desktop 'runtime-host') -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $resources 'host') (Join-Path $desktop 'runtime-host') -Recurse
          Remove-Item (Join-Path $desktop 'resources') -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $resources 'desktop-resources') (Join-Path $desktop 'resources') -Recurse

          "app_asar=$appAsar" >> $env:GITHUB_OUTPUT

      - name: Build the Windows x64 application shell
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DSH_DESKTOP_TARGET_PLATFORM: win32
          DSH_DESKTOP_TARGET_ARCH: x64
        run: pnpm exec electron-builder --win dir --x64 --config.forceCodeSigning=false

      - name: Restore the byte-exact accepted app.asar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\dist\win-unpacked\resources\app.asar'
          Copy-Item -LiteralPath '${{ steps.payload.outputs.app_asar }}' -Destination $destination -Force
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_APP_ASAR_SHA256) {
            throw "Windows app.asar hash is $hash; expected $env:EXPECTED_APP_ASAR_SHA256."
          }

      - name: Build the unsigned NSIS preview installer
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DSH_DESKTOP_TARGET_PLATFORM: win32
          DSH_DESKTOP_TARGET_ARCH: x64
        run: |
          pnpm exec electron-builder --win nsis --x64 `
            --prepackaged dist/win-unpacked `
            --config.forceCodeSigning=false

      - name: Install, launch Host, and uninstall on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\dist'
          $installers = @(Get-ChildItem $dist -File -Filter '*Setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $installer = $installers[0]

          function Invoke-HarnessInstaller([string] $label) {
            $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
            if (-not $process.WaitForExit(300000)) {
              taskkill /PID $process.Id /T /F | Out-Host
              throw "$label install did not exit within 300 seconds."
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "$label install exited with $($process.ExitCode)."
            }
          }

          function Remove-ApplicationFilesButKeepRegistration([string] $applicationDirectory) {
            Remove-Item -LiteralPath $applicationDirectory -Recurse -Force
            if (Test-Path -LiteralPath $applicationDirectory) {
              throw 'The simulated manually deleted program directory remained.'
            }
          }

          Invoke-HarnessInstaller 'fresh'

          $applications = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') `
            -Recurse -File -Filter 'DeepSeek Harness.exe' -ErrorAction SilentlyContinue)
          if ($applications.Count -ne 1) {
            throw "Expected exactly one installed application; found $($applications.Count)."
          }
          $application = $applications[0]
          $testRoot = Join-Path $env:RUNNER_TEMP 'dsh-windows-preview-smoke'
          $userData = Join-Path $testRoot 'user-data'
          $env:DSH_HOME = Join-Path $testRoot 'dsh-home'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $stdout = Join-Path $testRoot 'stdout.log'
          $stderr = Join-Path $testRoot 'stderr.log'
          $applicationProcess = Start-Process -FilePath $application.FullName `
            -ArgumentList "--user-data-dir=$userData" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          $deadline = (Get-Date).AddSeconds(75)
          $hostReady = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $applicationProcess.Refresh()
            if ($applicationProcess.HasExited) { break }
            $hostProcess = Get-CimInstance Win32_Process |
              Where-Object {
                $_.CommandLine -match '@deepseek-ai[\\/]dsh[\\/]lib[\\/]bin\.js' -and
                $_.CommandLine -match '(^|\s)web(\s|$)'
              } |
              Select-Object -First 1
            if ($null -ne $hostProcess) {
              $hostReady = $true
              break
            }
          }
          if (-not $hostReady) {
            if (Test-Path $stdout) { Get-Content $stdout | Out-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Out-Host }
            throw 'The packaged Harness Host did not become observable within 75 seconds.'
          }

          $pnpmCommand = Join-Path $env:DSH_HOME 'preset-runtime\bin\pnpm.cmd'
          if (-not (Test-Path -LiteralPath $pnpmCommand -PathType Leaf)) {
            throw "The packaged Host did not expose pnpm at $pnpmCommand."
          }
          $packageManager = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'package.json') |
            ConvertFrom-Json).packageManager
          $expectedPnpmVersion = ($packageManager -split '@')[-1]
          $pnpmVersion = (& $pnpmCommand --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $pnpmVersion -ne $expectedPnpmVersion) {
            throw "The bundled pnpm command reported '$pnpmVersion'; expected '$expectedPnpmVersion'."
          }

          Invoke-HarnessInstaller 'in-place-preview-upgrade'
          $applicationProcess.Refresh()
          if (-not $applicationProcess.HasExited) {
            taskkill /PID $applicationProcess.Id /T /F | Out-Host
            throw 'The in-place preview upgrade left the previous application process running.'
          }
          $upgradedApplications = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') `
            -Recurse -File -Filter 'DeepSeek Harness.exe' -ErrorAction SilentlyContinue)
          if ($upgradedApplications.Count -ne 1) {
            throw "Expected one upgraded application; found $($upgradedApplications.Count)."
          }
          $application = $upgradedApplications[0]
          $uninstallers = @(Get-ChildItem $application.DirectoryName -File -Filter 'Uninstall*.exe')
          if ($uninstallers.Count -ne 1) {
            throw "Expected exactly one uninstaller; found $($uninstallers.Count)."
          }
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall exited with $($uninstall.ExitCode)." }
          # NSIS can return from its launcher before the copied background
          # uninstaller removes the installation directory and exits. Starting
          # the next installer during that window can block on the old process.
          $uninstallDeadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $uninstallDeadline -and (Test-Path $application.DirectoryName)) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path $application.DirectoryName) { throw 'The installation directory remained after uninstall.' }
          $backgroundDeadline = (Get-Date).AddSeconds(60)
          do {
            $backgroundUninstallers = @(Get-CimInstance Win32_Process |
              Where-Object Name -Like 'Uninstall*.exe')
            if ($backgroundUninstallers.Count -eq 0) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $backgroundDeadline)
          if ($backgroundUninstallers.Count -ne 0) {
            $backgroundUninstallers |
              Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine |
              Format-List |
              Out-Host
            throw 'The copied background uninstaller remained after uninstall.'
          }

          Invoke-HarnessInstaller 'residual-seed'
          $seedApplications = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') `
            -Recurse -File -Filter 'DeepSeek Harness.exe' -ErrorAction SilentlyContinue)
          if ($seedApplications.Count -ne 1) {
            throw "Expected one residual-seed application; found $($seedApplications.Count)."
          }
          Remove-ApplicationFilesButKeepRegistration ($seedApplications[0].DirectoryName)
          Invoke-HarnessInstaller 'residual-repair'
          $repairedApplications = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') `
            -Recurse -File -Filter 'DeepSeek Harness.exe' -ErrorAction SilentlyContinue)
          if ($repairedApplications.Count -ne 1) {
            throw "Expected one repaired application; found $($repairedApplications.Count)."
          }
          $repairedDirectory = $repairedApplications[0].DirectoryName
          $repairedUninstallers = @(Get-ChildItem $repairedDirectory `
            -File -Filter 'Uninstall*.exe')
          if ($repairedUninstallers.Count -ne 1) {
            throw "Expected one repaired uninstaller; found $($repairedUninstallers.Count)."
          }
          $repairedUninstall = Start-Process -FilePath $repairedUninstallers[0].FullName `
            -ArgumentList '/S' -Wait -PassThru
          if ($repairedUninstall.ExitCode -ne 0) {
            throw "Repaired silent uninstall exited with $($repairedUninstall.ExitCode)."
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $dist 'SHA256SUMS-windows-x64-preview.txt'
          "$hash  $($installer.Name)" | Set-Content $checksum -Encoding ascii
          @(
            'native_runner=windows-2025',
            'silent_install=PASS',
            'packaged_host_start=PASS',
            'bundled_pnpm_command=PASS',
            'in_place_preview_upgrade=PASS',
            'silent_uninstall=PASS',
            'manually_deleted_install_repair=PASS',
            'repaired_uninstaller=PASS',
            "app_asar_sha256=$env:EXPECTED_APP_ASAR_SHA256",
            "installer_sha256=$hash"
          ) | Set-Content (Join-Path $dist 'WINDOWS_PREVIEW_VERIFICATION.txt') -Encoding ascii

      - name: Preserve verified Windows preview as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-${{ inputs.release_tag }}-windows-x64-preview
          path: |
            apps/desktop/dist/*Setup.exe
            apps/desktop/dist/*Setup.exe.blockmap
            apps/desktop/dist/SHA256SUMS-windows-x64-preview.txt
            apps/desktop/dist/WINDOWS_PREVIEW_VERIFICATION.txt
          if-no-files-found: error
          retention-days: 7

      - name: Attach verified Windows installer to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\dist'
          $installers = @(Get-ChildItem $dist -File -Filter '*Setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer; found $($installers.Count)." }
          $installer = $installers[0].FullName

          $release = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Release $env:RELEASE_TAG cannot be read." }
          $name = [System.IO.Path]::GetFileName($installer)
          if ($release.assets.name -contains $name) {
            throw "Release asset $name already exists; refusing to overwrite it."
          }

          gh release upload $env:RELEASE_TAG $installer --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the verified Windows installer failed.' }
