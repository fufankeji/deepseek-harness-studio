name: Windows Installer Lifecycle Validation

on:
  workflow_dispatch:
    inputs:
      run_real_vision:
        description: Run the installed-app V4 Vision journey with the protected repository secret
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-and-verify:
    name: Build and verify install, running uninstall, reinstall, and residual repair
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}\setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify installer and runtime-staging contracts
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/packaging-config.spec.ts
          apps/desktop/tests/runtime-staging-pruner.spec.ts
          apps/desktop/tests/window-lifecycle.spec.ts

      - name: Build and stage the Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DSH_DESKTOP_TARGET_PLATFORM = 'win32'
          $env:DSH_DESKTOP_TARGET_ARCH = 'x64'
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw "Workspace build exited with $LASTEXITCODE." }
          pnpm --dir apps/desktop exec node --import tsx scripts/stage-runtime.ts
          if ($LASTEXITCODE -ne 0) { throw "Runtime staging exited with $LASTEXITCODE." }

      - name: Build the Windows x64 application and installer
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DSH_DESKTOP_TARGET_PLATFORM: win32
          DSH_DESKTOP_TARGET_ARCH: x64
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec electron-builder --win dir --x64 --config.forceCodeSigning=false
          if ($LASTEXITCODE -ne 0) { throw "Windows application build exited with $LASTEXITCODE." }
          pnpm exec electron-builder --win nsis --x64 `
            --prepackaged dist/win-unpacked `
            --config.forceCodeSigning=false
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build exited with $LASTEXITCODE." }

      - name: Process one image with the packaged Windows Sharp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\dist\win-unpacked'
          $application = Join-Path $unpacked 'DeepSeek Harness.exe'
          $smoke = Join-Path $unpacked 'sharp-runtime-smoke.cjs'
          @'
          const sharp = require('./resources/host/node_modules/sharp')
          sharp({
            create: {
              width: 64,
              height: 36,
              channels: 4,
              background: { r: 36, g: 93, b: 184, alpha: 1 },
            },
          })
            .webp()
            .resize(32, 18)
            .png()
            .toBuffer({ resolveWithObject: true })
            .then(({ data, info }) => {
              if (info.format !== 'png' || info.width !== 32 || info.height !== 18 || data.length === 0) {
                throw new Error(`unexpected Sharp output: ${JSON.stringify({ info, bytes: data.length })}`)
              }
              console.log(JSON.stringify({
                format: info.format,
                width: info.width,
                height: info.height,
                bytes: data.length,
                sharp: sharp.versions.sharp,
                vips: sharp.versions.vips,
              }))
            })
            .catch((error) => {
              console.error(error)
              process.exitCode = 1
            })
          '@ | Set-Content -LiteralPath $smoke -Encoding utf8
          try {
            $env:ELECTRON_RUN_AS_NODE = '1'
            $process = Start-Process -FilePath $application `
              -ArgumentList ('"{0}"' -f $smoke) `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Packaged Windows Sharp smoke exited with $($process.ExitCode)."
            }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $smoke -Force -ErrorAction SilentlyContinue
          }

      - name: Verify custom-directory install, running uninstall, and reinstall
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DSH_WINDOWS_VISION_E2E_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\dist'
          $installers = @(Get-ChildItem $dist -File -Filter '*Setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          $blockmaps = @(Get-ChildItem $dist -File -Filter '*Setup.exe.blockmap')
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one Windows installer blockmap; found $($blockmaps.Count)."
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'dsh-installer-custom'
          $testRoot = Join-Path $env:RUNNER_TEMP 'dsh-installer-lifecycle'
          $userData = Join-Path $testRoot 'user-data'
          $env:DSH_HOME = Join-Path $testRoot 'dsh-home'
          $nodeExecutable = (Get-Command node -ErrorAction Stop).Source
          $visionDriver = Join-Path $env:GITHUB_WORKSPACE 'node_modules\tsx\dist\cli.mjs'
          if (-not (Test-Path -LiteralPath $visionDriver -PathType Leaf)) {
            throw 'The committed Windows V4 Vision driver runtime is unavailable.'
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          $runRealVision = '${{ inputs.run_real_vision }}' -eq 'true'
          if ($runRealVision -and [string]::IsNullOrWhiteSpace($env:DEEPSEEK_API_KEY)) {
            throw 'run_real_vision requires the protected DSH_WINDOWS_VISION_E2E_KEY repository secret.'
          }
          $visionWorkspaceTitle = 'dsh-windows-vision-workspace'
          $visionWorkspace = Join-Path $testRoot $visionWorkspaceTitle
          $visionImage = Join-Path $testRoot 'windows-vision-blue.png'
          if ($runRealVision) {
            New-Item -ItemType Directory -Path $visionWorkspace -Force | Out-Null
            $storageDirectory = Join-Path $env:DSH_HOME 'storages'
            New-Item -ItemType Directory -Path $storageDirectory -Force | Out-Null
            $workspaceId = '7f0dc93f-026e-45f8-9050-39f206cb7f0f'
            $now = [DateTime]::UtcNow.ToString('o')
            $workspaceDocument = @{
              unit = @{ name = 'workspace'; version = 2 }
              global = @{
                initialized = $true
                workspaceIds = @($workspaceId)
                archivedSessionIds = @()
              }
              tables = @{
                workspaces = @{
                  $workspaceId = @{
                    path = $visionWorkspace
                    title = $visionWorkspaceTitle
                    sessionIds = @()
                    createdAt = $now
                    updatedAt = $now
                  }
                }
              }
            }
            $workspaceDocument | ConvertTo-Json -Depth 8 |
              Set-Content (Join-Path $storageDirectory 'workspace.json') -Encoding utf8
            @'
          ui-onboarding:
            welcomeNoticeVersion: 2026-08-13.1
          vision-enhancement:
            enabled: true
          agent-default-model:
            provider: deepseek-official
            model: deepseek-v4-flash-vision-exp
            reasoningEffort: high
          '@ | Set-Content (Join-Path $env:DSH_HOME 'settings.yaml') -Encoding utf8

            Add-Type -AssemblyName System.Drawing
            $bitmap = [System.Drawing.Bitmap]::new(256, 256)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::FromArgb(36, 93, 184))
              $bitmap.Save($visionImage, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }

          function Invoke-HarnessInstaller([string] $label) {
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            $arguments = "/S /currentuser /D=$installDirectory"
            $process = Start-Process -FilePath $installer.FullName `
              -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(180000)) {
              taskkill /PID $process.Id /T /F | Out-Host
              throw "$label install did not exit within 180 seconds."
            }
            $process.WaitForExit()
            $timer.Stop()
            if ($process.ExitCode -ne 0) {
              throw "$label install exited with $($process.ExitCode)."
            }
            return [int][math]::Ceiling($timer.Elapsed.TotalSeconds)
          }

          function Start-Harness([string] $label) {
            $application = Join-Path $installDirectory 'DeepSeek Harness.exe'
            if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
              throw "$label application is missing from the selected installation directory."
            }
            $stdout = Join-Path $testRoot "$label-stdout.log"
            $stderr = Join-Path $testRoot "$label-stderr.log"
            $process = Start-Process -FilePath $application `
              -ArgumentList "--user-data-dir=$userData --remote-debugging-address=127.0.0.1 --remote-debugging-port=9226" `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 3
              $process.Refresh()
              if ($process.HasExited) { break }
              $hostProcess = Get-CimInstance Win32_Process |
                Where-Object {
                  $_.CommandLine -match '@deepseek-ai[\\/]dsh[\\/]lib[\\/]bin\.js' -and
                  $_.CommandLine -match '(^|\s)web(\s|$)'
                } |
                Select-Object -First 1
              if ($null -ne $hostProcess) { return $process }
            }
            if (Test-Path $stdout) { Get-Content $stdout | Out-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Out-Host }
            throw "$label packaged Host did not become observable within 90 seconds."
          }

          function Invoke-RunningUninstall([System.Diagnostics.Process] $application, [string] $label) {
            $uninstallers = @(Get-ChildItem $installDirectory -File -Filter 'Uninstall*.exe')
            if ($uninstallers.Count -ne 1) {
              throw "$label expected one uninstaller; found $($uninstallers.Count)."
            }
            Get-CimInstance Win32_Process |
              Where-Object {
                $_.ExecutablePath -and
                $_.ExecutablePath.StartsWith($installDirectory, [System.StringComparison]::OrdinalIgnoreCase)
              } |
              Select-Object ProcessId, ParentProcessId, Name, ExecutablePath |
              Format-List |
              Out-Host
            $process = Start-Process -FilePath $uninstallers[0].FullName `
              -ArgumentList '/S /currentuser' -PassThru
            if (-not $process.WaitForExit(180000)) {
              taskkill /PID $process.Id /T /F | Out-Host
              throw "$label running uninstall did not exit within 180 seconds."
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "$label running uninstall exited with $($process.ExitCode)."
            }
            # NSIS can return from its launcher before the copied background
            # uninstaller finishes closing the application and removing files.
            $appExitDeadline = (Get-Date).AddSeconds(45)
            $application.Refresh()
            while (-not $application.HasExited -and (Get-Date) -lt $appExitDeadline) {
              Start-Sleep -Seconds 1
              $application.Refresh()
            }
            if (-not $application.HasExited) {
              Get-CimInstance Win32_Process -Filter "ProcessId = $($application.Id)" |
                Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine |
                Format-List |
                Out-Host
              taskkill /PID $application.Id /T /F | Out-Host
              throw "$label application process remained after uninstall."
            }
            $directoryDeadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $directoryDeadline -and (Test-Path -LiteralPath $installDirectory)) {
              Start-Sleep -Seconds 2
            }
            if (Test-Path -LiteralPath $installDirectory) {
              throw "$label installation directory remained after uninstall."
            }
            $residual = @(Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and
              $_.ExecutablePath.StartsWith($installDirectory, [System.StringComparison]::OrdinalIgnoreCase)
            })
            if ($residual.Count -ne 0) {
              $residual | Select-Object ProcessId, Name, ExecutablePath, CommandLine | Format-List | Out-Host
              throw "$label left $($residual.Count) process(es) under the installation directory."
            }
          }

          function Remove-ApplicationFilesButKeepRegistration(
            [System.Diagnostics.Process] $application,
            [string] $label
          ) {
            taskkill /PID $application.Id /T /F | Out-Host
            $exitDeadline = (Get-Date).AddSeconds(30)
            $application.Refresh()
            while (-not $application.HasExited -and (Get-Date) -lt $exitDeadline) {
              Start-Sleep -Seconds 1
              $application.Refresh()
            }
            if (-not $application.HasExited) {
              throw "$label application process remained before residual-install simulation."
            }
            Remove-Item -LiteralPath $installDirectory -Recurse -Force
            if (Test-Path -LiteralPath $installDirectory) {
              throw "$label installation directory remained after residual-install simulation."
            }
          }

          $freshInstallSeconds = Invoke-HarnessInstaller 'fresh'
          $freshApplication = Start-Harness 'fresh'
          if ($runRealVision) {
            $cdpDeadline = (Get-Date).AddSeconds(60)
            do {
              try {
                Invoke-RestMethod -Uri 'http://127.0.0.1:9226/json/version' -TimeoutSec 3 | Out-Null
                $cdpReady = $true
              } catch {
                $cdpReady = $false
                Start-Sleep -Seconds 2
              }
            } while (-not $cdpReady -and (Get-Date) -lt $cdpDeadline)
            if (-not $cdpReady) { throw 'Installed Desktop CDP endpoint did not become ready.' }

            $env:DSH_DESKTOP_VISION_CDP = 'http://127.0.0.1:9226'
            $env:DSH_DESKTOP_VISION_IMAGE_PATH = $visionImage
            $env:DSH_DESKTOP_VISION_WORKSPACE_TITLE = $visionWorkspaceTitle
            & $nodeExecutable $visionDriver apps/desktop/scripts/verify-installed-vision-e2e.ts
            if ($LASTEXITCODE -ne 0) {
              throw "Installed Windows V4 Vision journey exited with $LASTEXITCODE."
            }
            $filesIndex = Join-Path $env:DSH_HOME 'llm-deepseek\files-v3.json'
            if (-not (Test-Path -LiteralPath $filesIndex -PathType Leaf)) {
              throw 'Installed Windows V4 Vision journey produced no Files API index.'
            }
            $filesDocument = Get-Content -LiteralPath $filesIndex -Raw | ConvertFrom-Json
            if ($filesDocument.formatVersion -ne 3 -or @($filesDocument.records).Count -lt 1) {
              throw 'Installed Windows V4 Vision journey produced an invalid Files API index.'
            }
            $windowsVisionStatus = 'PASS'
          } else {
            $windowsVisionStatus = 'SKIPPED'
          }
          $inPlaceUpgradeSeconds = Invoke-HarnessInstaller 'in-place-upgrade'
          $freshApplication.Refresh()
          if (-not $freshApplication.HasExited) {
            taskkill /PID $freshApplication.Id /T /F | Out-Host
            throw 'The in-place upgrade left the previous application process running.'
          }
          $upgradedApplication = Start-Harness 'in-place-upgrade'
          Invoke-RunningUninstall $upgradedApplication 'in-place-upgrade'

          $reinstallSeconds = Invoke-HarnessInstaller 'reinstall'
          $reinstalledApplication = Start-Harness 'reinstall'
          Remove-ApplicationFilesButKeepRegistration $reinstalledApplication 'reinstall'

          $repairSeconds = Invoke-HarnessInstaller 'residual-repair'
          $repairedApplication = Start-Harness 'residual-repair'
          Invoke-RunningUninstall $repairedApplication 'residual-repair'

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'native_runner=windows-2025',
            'assisted_install_directory=PASS',
            'running_uninstall=PASS',
            'same_directory_reinstall=PASS',
            'running_in_place_upgrade=PASS',
            'reinstalled_packaged_host_start=PASS',
            'manually_deleted_install_repair=PASS',
            'repaired_packaged_host_start=PASS',
            'packaged_sharp_processing=PASS',
            "installed_v4_vision=$windowsVisionStatus",
            'differential_update_blockmap=PASS',
            "fresh_install_seconds=$freshInstallSeconds",
            "in_place_upgrade_seconds=$inPlaceUpgradeSeconds",
            "reinstall_seconds=$reinstallSeconds",
            "repair_seconds=$repairSeconds",
            "installer_sha256=$hash"
          ) | Set-Content (Join-Path $dist 'WINDOWS_INSTALLER_LIFECYCLE_VERIFICATION.txt') -Encoding ascii

      - name: Upload the verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-${{ github.sha }}-windows-installer-validation
          path: |
            apps/desktop/dist/*Setup.exe
            apps/desktop/dist/*Setup.exe.blockmap
            apps/desktop/dist/WINDOWS_INSTALLER_LIFECYCLE_VERIFICATION.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
